[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-swing-agent"
version = "0.1.0"
description = "Offline educational paper-trading foundation for NSE/BSE swing research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
data = ["pyarrow>=15"]

[project.scripts]
nse-swing-demo = "nse_swing_agent.demo:main"
nse-swing-agent = "nse_swing_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nse_swing_agent = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
